<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PITCH — Know before you pitch.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#F7F6F3;
  --surface:#FFFFFF;
  --ink:#191714;
  --ink-soft:#5B5650;
  --ink-faint:#9A948B;
  --line:#E7E3DC;
  --line-soft:#F0EDE7;
  --accent:#1F5F4F;      /* deep pine - primary brand */
  --accent-soft:#E4EFEA;
  --green:#1E7A4C; --green-soft:#E4F3EA;
  --yellow:#A9760A; --yellow-soft:#FBF0DA;
  --red:#B23A2E; --red-soft:#FAE7E3;
  --blue:#2A5C9A; --blue-soft:#E6EEF8;
  --purple:#6B4C9A; --purple-soft:#EFE7F7;
  --orange:#C1631A; --orange-soft:#FBEBDC;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow: 0 1px 2px rgba(25,23,20,.04), 0 8px 24px -12px rgba(25,23,20,.12);
  --font-display: 'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif;
  --font-body: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --hover-pad:18px;
}
@media(prefers-color-scheme:dark){
  :root:not(.theme-light){
    --paper:#141311; --surface:#1C1B18; --ink:#F2F0EC; --ink-soft:#B7B2A8; --ink-faint:#7A756B;
    --line:#332F29; --line-soft:#242220; --accent:#3E9C81; --accent-soft:#173028;
    --green:#4CBE86; --green-soft:#173025; --yellow:#E0AE4B; --yellow-soft:#33280F;
    --red:#E2685A; --red-soft:#3A1D18; --blue:#6DA1E0; --blue-soft:#182636;
    --purple:#B49BE0; --purple-soft:#251E36; --orange:#E09A56; --orange-soft:#332212;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root.theme-dark{
  --paper:#141311; --surface:#1C1B18; --ink:#F2F0EC; --ink-soft:#B7B2A8; --ink-faint:#7A756B;
  --line:#332F29; --line-soft:#242220; --accent:#3E9C81; --accent-soft:#173028;
  --green:#4CBE86; --green-soft:#173025; --yellow:#E0AE4B; --yellow-soft:#33280F;
  --red:#E2685A; --red-soft:#3A1D18; --blue:#6DA1E0; --blue-soft:#182636;
  --purple:#B49BE0; --purple-soft:#251E36; --orange:#E09A56; --orange-soft:#332212;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; max-width:100%;}

/* ---------- Custom scrollbars (no native browser chrome) ---------- */
*{scrollbar-width:thin; scrollbar-color:var(--ink-faint) transparent;}
*::-webkit-scrollbar{width:8px; height:8px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px; border:2px solid transparent; background-clip:padding-box;}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-faint); background-clip:padding-box;}
*::-webkit-scrollbar-corner{background:transparent;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;
  overflow-x:hidden; width:100%;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-.01em;}
button{font-family:inherit;}
a{color:var(--accent);}
::selection{background:var(--accent-soft);}
.hidden{display:none !important;}
input,textarea,select{
  font-family:inherit; font-size:15px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-s); padding:10px 12px;
  color:var(--ink); width:100%; outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
textarea{resize:vertical; min-height:70px;}
label{display:block; font-size:12.5px; color:var(--ink-soft); margin:0 0 5px; font-weight:600;}
.field{margin-bottom:14px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:220px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:20px 12px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:9px; padding:6px 10px 22px;}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;}
.brand .name{font-family:var(--font-display); font-weight:700; font-size:19px;}
.brand .tag{font-size:10.5px; color:var(--ink-faint); margin-top:-2px;}
.navlist{display:flex; flex-direction:column; gap:2px;}
.navitem{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-s);
  color:var(--ink-soft); cursor:pointer; font-weight:600; font-size:14px; border:none; background:none; text-align:left; width:100%;
}
.navitem svg{width:17px;height:17px; flex-shrink:0;}
.navitem:hover{background:var(--line-soft); color:var(--ink);}
.navitem.active{background:var(--accent-soft); color:var(--accent);}
.sidebar-foot{margin-top:auto; font-size:11px; color:var(--ink-faint); padding:10px;}

.main{flex:1; min-width:0; padding:28px 34px 80px; max-width:1180px;}
.topbar{display:none;}

.page-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:27px;}
.page-head .sub{color:var(--ink-soft); font-size:13.5px; margin-top:3px;}

.btn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); padding:9px 15px; border-radius:var(--radius-s); font-weight:600; font-size:13.5px;
  cursor:pointer; white-space:nowrap; transition:transform .06s ease;
}
.btn:active{transform:scale(.97);}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ai{background:var(--purple); border-color:var(--purple); color:#fff;}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-danger{color:var(--red); border-color:var(--red-soft); background:var(--red-soft);}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn-block{width:100%; justify-content:center;}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.iconbtn svg{width:16px;height:16px;}

/* ---------- Theme switch ---------- */
.theme-switch{
  display:flex; align-items:center; gap:9px; margin-top:10px; padding:8px 10px;
  border:1px solid var(--line); background:var(--surface); border-radius:99px;
  cursor:pointer; color:var(--ink-soft); font-size:12.5px; font-weight:600;
  width:100%; justify-content:flex-start;
}
.theme-switch:hover{border-color:var(--ink-faint); color:var(--ink);}
.theme-switch-track{
  position:relative; width:34px; height:19px; border-radius:99px; flex-shrink:0;
  background:var(--line); transition:background .18s ease;
}
:root.theme-dark .theme-switch-track{background:var(--accent);}
.theme-switch-thumb{
  position:absolute; top:2px; left:2px; width:15px; height:15px; border-radius:50%;
  background:var(--surface); box-shadow:0 1px 2px rgba(0,0,0,.25);
  transition:transform .18s ease;
}
:root.theme-dark .theme-switch-thumb{transform:translateX(15px);}
.theme-switch .theme-icon{width:14px; height:14px; flex-shrink:0;}
.theme-switch .icon-moon{display:none;}
:root.theme-dark .theme-switch .icon-sun{display:none;}
:root.theme-dark .theme-switch .icon-moon{display:block;}
.theme-switch::after{content:'Dark mode'; }
:root.theme-dark .theme-switch::after{content:'Light mode';}
.theme-switch-sm{
  width:34px; height:34px; padding:0; justify-content:center; border-radius:9px; gap:0;
}
.theme-switch-sm::after{content:'';}
.theme-switch-sm .theme-switch-track{display:none;}
.theme-switch-sm .theme-icon{width:16px; height:16px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; box-shadow:var(--shadow);}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:700; margin-bottom:10px;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:700;}
.badge-green{background:var(--green-soft); color:var(--green);}
.badge-yellow{background:var(--yellow-soft); color:var(--yellow);}
.badge-red{background:var(--red-soft); color:var(--red);}
.badge-blue{background:var(--blue-soft); color:var(--blue);}
.badge-purple{background:var(--purple-soft); color:var(--purple);}
.badge-orange{background:var(--orange-soft); color:var(--orange);}
.badge-gray{background:var(--line-soft); color:var(--ink-soft);}

/* ---------- Dashboard ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px;}
.stat .num{font-family:var(--font-display); font-size:26px; font-weight:700;}
.stat .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}

.dash-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media(max-width:980px){.dash-grid{grid-template-columns:1fr;}}
.attn-item{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-soft); cursor:pointer; min-width:0;}
.attn-item:last-child{border-bottom:none;}
.attn-item:hover{background:var(--line-soft); margin:0 calc(-1 * var(--hover-pad)); padding:12px var(--hover-pad); border-radius:8px;}
.attn-item > div:first-child{min-width:0; flex:1;}
.attn-item .score-badge,.attn-item .badge{flex-shrink:0;}
.attn-name{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.attn-meta{font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.pipe-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
.pipe-chip{flex-shrink:0; min-width:96px; background:var(--line-soft); border-radius:var(--radius-s); padding:10px 12px; cursor:pointer;}
.pipe-chip .n{font-family:var(--font-display); font-size:20px; font-weight:700;}
.pipe-chip .l{font-size:11px; color:var(--ink-soft); font-weight:600;}

/* ---------- Business list ---------- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.toolbar input[type=search]{flex:1 1 220px; min-width:160px; max-width:280px;}
.toolbar select{flex:1 1 130px; width:auto; min-width:0; max-width:160px;}
@media(max-width:520px){
  .toolbar input[type=search],.toolbar select{max-width:100%; flex:1 1 100%;}
}
.biz-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; min-width:0;}
.biz-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; min-width:0; overflow:hidden;}
.biz-card:hover{border-color:var(--accent);}
.biz-card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; min-width:0;}
.biz-card .top > div:first-child{min-width:0; flex:1;}
.biz-card .top .score-badge{flex-shrink:0;}
.biz-card h3{font-size:16.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.biz-card .meta{font-size:12.5px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.biz-tags{display:flex; flex-wrap:wrap; gap:6px;}
.biz-actions{display:flex; flex-wrap:wrap; gap:6px;}
.score-badge{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.biz-tags{display:flex; gap:6px; flex-wrap:wrap;}
.biz-actions{display:flex; gap:6px; margin-top:4px;}
.demo-flag{font-size:10px; font-weight:700; color:var(--ink-faint); background:var(--line-soft); padding:2px 7px; border-radius:5px; letter-spacing:.03em;}

.empty{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty h3{font-size:18px; margin-bottom:6px; color:var(--ink);}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(25,23,20,.45); display:flex; align-items:flex-end; justify-content:center; z-index:200; backdrop-filter:blur(2px);}
@media(min-width:760px){.modal-overlay{align-items:center;}}
.modal{background:var(--surface); width:100%; max-width:640px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:22px 22px calc(22px + env(safe-area-inset-bottom));}
@media(min-width:760px){.modal{border-radius:var(--radius-l);}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; position:sticky; top:0; background:var(--surface); padding-bottom:4px;}
.modal-head h2{font-size:19px;}

/* ---------- Profile page ---------- */
.profile-head{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;}
.profile-title h1{font-size:26px;}
.profile-title .meta{color:var(--ink-soft); font-size:13.5px; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.qa-row{display:flex; gap:8px; flex-wrap:wrap;}

.summary-card{background:linear-gradient(180deg,var(--accent-soft),var(--surface)); border:1px solid var(--line); border-radius:var(--radius-l); padding:20px; margin-bottom:20px;}
.summary-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:6px;}
@media(max-width:980px){.summary-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.summary-grid{grid-template-columns:1fr;}}
.summary-item .k{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--accent); margin-bottom:4px;}
.summary-item .v{font-size:13.5px; color:var(--ink); line-height:1.45;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto;}
.tab{padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--accent); border-color:var(--accent);}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

.kv{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);}
.kv .v{font-weight:600; text-align:right;}

.rating-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.rating-row .lbl2{width:130px; font-size:13px; font-weight:600; flex-shrink:0;}
.rating-row input[type=range]{flex:1;}
.rating-row .val{width:26px; text-align:right; font-weight:700; font-size:13px;}

.timeline{display:flex; flex-direction:column; gap:0;}
.tl-item{position:relative; padding:0 0 20px 22px; border-left:2px solid var(--line);}
.tl-item:last-child{border-color:transparent;}
.tl-item::before{content:''; position:absolute; left:-6px; top:2px; width:10px;height:10px;border-radius:50%; background:var(--accent);}
.tl-date{font-size:11.5px; color:var(--ink-faint); font-weight:700;}
.tl-body{background:var(--line-soft); border-radius:var(--radius-s); padding:12px 14px; margin-top:5px;}
.tl-body .row1{display:flex; justify-content:space-between; gap:8px; margin-bottom:4px;}
.tl-body strong{font-size:13.5px;}
.tl-actions{display:flex;gap:6px;margin-top:8px;}

.chip-select{display:flex; gap:8px; flex-wrap:wrap;}
.chip-opt{padding:7px 13px; border-radius:99px; border:1px solid var(--line); font-size:13px; font-weight:600; cursor:pointer; background:var(--surface);}
.chip-opt.sel{background:var(--accent); border-color:var(--accent); color:#fff;}

.service-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
@media(max-width:700px){.service-grid{grid-template-columns:repeat(2,1fr);}}

.ai-block{background:var(--purple-soft); border:1px solid #ded0f0; border-radius:var(--radius-m); padding:16px; margin-bottom:14px;}
.ai-block h4{color:var(--purple); font-size:13px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
.ai-block .body{font-size:13.5px; line-height:1.6; white-space:pre-wrap;}
.ai-loading{display:flex; align-items:center; gap:10px; color:var(--purple); font-weight:600; font-size:13.5px; padding:20px 0;}
.spinner{width:16px;height:16px;border:2px solid var(--purple); border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Quick profile */
.qp-field textarea, .qp-field input{font-size:16px; padding:13px;}
.qp-field label{font-size:13.5px;}

/* Pipeline */
.kanban{display:flex; gap:12px; overflow-x:auto; padding-bottom:14px;}
.kcol{flex-shrink:0; width:250px; background:var(--line-soft); border-radius:var(--radius-m); padding:10px;}
.kcol-head{display:flex; justify-content:space-between; padding:6px 6px 10px; font-weight:700; font-size:13px;}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:8px; cursor:pointer;}
.kcard h4{font-size:13.5px; margin-bottom:4px;}
.kcard .meta{font-size:11.5px; color:var(--ink-soft); display:flex; justify-content:space-between; margin-top:6px;}
.stage-move{display:flex; gap:4px; margin-top:8px;}
.stage-move button{flex:1; font-size:10.5px; padding:4px;}

/* Follow-ups */
.fu-group h3{font-size:14px; margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
.fu-item{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-s); padding:12px 14px; margin-bottom:8px;}
.fu-item.overdue{border-color:var(--red); background:var(--red-soft);}
.fu-item.today{border-color:var(--orange); background:var(--orange-soft);}
.fu-left strong{font-size:13.5px;}
.fu-left div{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.fu-actions{display:flex; gap:6px; flex-shrink:0;}

/* Settings */
.settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:800px){.settings-grid{grid-template-columns:1fr;}}

/* Toast */
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 20px; border-radius:99px; font-size:13.5px; font-weight:600; z-index:500; opacity:0; pointer-events:none; transition:all .25s ease;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* Report */
#reportOverlay{position:fixed; inset:0; background:#3a3733; z-index:300; overflow-y:auto; display:none;}
#reportOverlay.show{display:block;}
.report-toolbar{position:sticky; top:0; background:var(--ink); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; z-index:2;}
.report-toolbar .btn{background:#fff; color:var(--ink); border-color:#fff;}
.report-page{max-width:800px; margin:24px auto 60px; background:#fff; padding:56px 56px; box-shadow:0 10px 40px rgba(0,0,0,.3); min-height:1000px;}
.rp-cover{text-align:center; padding:60px 0 40px; border-bottom:3px solid var(--accent); margin-bottom:36px;}
.rp-cover .pmark{font-family:var(--font-display); font-size:15px; letter-spacing:.2em; color:var(--accent); font-weight:700;}
.rp-cover .ptag{font-size:12px; color:var(--ink-soft); margin-bottom:26px; font-style:italic;}
.rp-cover h1{font-size:34px; margin-bottom:8px;}
.rp-cover .subline{color:var(--ink-soft); font-size:14px;}
.rp-cover .badges{margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
.rp-section{margin-bottom:30px;}
.rp-section h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:14px;}
.rp-sub{font-size:13px; font-weight:700; color:var(--ink); margin:14px 0 6px;}
.rp-text{font-size:13.5px; line-height:1.7; color:var(--ink);}
.rp-callout{background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:14px 16px; margin:10px 0;}
.rp-score{display:flex; align-items:center; gap:16px; margin:10px 0;}

   PITCH — Business Profiler + Sales Intelligence
   Single-file vanilla JS application
   ========================================================= */
const STORAGE_KEY = 'pitch_app_data';
const DATA_VERSION = 1;

/* =========================================================
   CLOUD SYNC (Supabase) — optional, additive.
   - localStorage remains the primary read/write cache (fast, offline-safe).
   - When Supabase is configured, every saveDB() also pushes the full
     DB document to Supabase (debounced) so other devices can pull it.
   - Nothing here changes existing localStorage behavior or app logic;
     it's a passive layer bolted onto loadDB()/saveDB().
   ========================================================= */
const SYNC_CONFIG_KEY = 'pitch_sync_config'; // {url, anonKey, deviceId, enabled}

  // Preconfigured Supabase project (public anon/publishable key).
  // The anon/publishable key is intended for browser use; protect data with RLS policies.
  const SUPABASE_DEFAULT_URL = 'https://zmojpxezljwooiloxwdv.supabase.co';
  const SUPABASE_DEFAULT_ANON_KEY = 'sb_publishable_TN_HpU6oxVgQx8i8ijI1RA_nUWgaDWB';
const SYNC_ROW_ID = 'pitch_main'; // single shared row per Supabase project holds the whole DB doc (JSONB)
let sbClient = null;
let syncState = { status:'idle', lastSyncedAt:null, lastError:null }; // idle|syncing|synced|error|offline
let _syncDebounceTimer = null;
let _syncInFlight = false;
let _syncQueued = false;
let _realtimeChannel = null;
let _applyingRemote = false; // guards against feedback loop while applying a remote update
let _lastLocalChangeAt = 0;
let _lastCloudChangeAt = 0;

function syncStamp(){ return new Date().toISOString(); }
function ensureSyncMeta(db){
  if(!db._sync || typeof db._sync !== 'object') db._sync = {};
  if(!db._sync.updatedAt) db._sync.updatedAt = db.updatedAt || db.createdAt || syncStamp();
  if(!db._sync.deletions || typeof db._sync.deletions !== 'object') db._sync.deletions = {};
  return db;
}
function markBusinessDeleted(id){
  ensureSyncMeta(DB);
  DB._sync.deletions[id] = syncStamp();
  DB._sync.updatedAt = syncStamp();
  _lastLocalChangeAt = Date.now();
}
function markBusinessPresent(id){
  ensureSyncMeta(DB);
  if(DB._sync.deletions[id]) delete DB._sync.deletions[id];
}
function syncTime(v){ const n = Date.parse(v || ''); return Number.isFinite(n) ? n : 0; }
function mergeSyncedDB(local, remote){
  local = migrate(local || {}); remote = migrate(remote || {});
  ensureSyncMeta(local); ensureSyncMeta(remote);
  const out = migrate(local);
  ensureSyncMeta(out);

  // Merge businesses independently so an addition/edit on Device A cannot erase
  // an addition/edit on Device B. Deletion tombstones prevent deleted records
  // from being resurrected by an older offline copy.
  const lm = new Map(local.businesses.map(b=>[b.id,b]));
  const rm = new Map(remote.businesses.map(b=>[b.id,b]));
  const ids = new Set([...lm.keys(), ...rm.keys(), ...Object.keys(local._sync.deletions), ...Object.keys(remote._sync.deletions)]);
  const deletions = {};
  const merged = [];

  for(const id of ids){
    const ld = local._sync.deletions[id];
    const rd = remote._sync.deletions[id];
    const deletionAt = Math.max(syncTime(ld), syncTime(rd));
    const lb = lm.get(id), rb = rm.get(id);
    const lu = syncTime(lb?.updatedAt), ru = syncTime(rb?.updatedAt);
    const latestBusinessAt = Math.max(lu, ru);
    if(deletionAt && deletionAt >= latestBusinessAt){
      deletions[id] = new Date(deletionAt).toISOString();
      continue;
    }
    const winner = lb && rb ? (lu >= ru ? lb : rb) : (lb || rb);
    if(winner){ merged.push(winner); }
  }

  out.businesses = merged;
  out._sync.deletions = deletions;
  // Settings/global metadata are last-write-wins, while business records above merge independently.
  const lGlobal = syncTime(local._sync.updatedAt), rGlobal = syncTime(remote._sync.updatedAt);
  if(rGlobal > lGlobal && remote.settings) out.settings = remote.settings;
  out._sync.updatedAt = new Date(Math.max(lGlobal, rGlobal)).toISOString();
  out.version = DATA_VERSION;
  return out;
}

/* Ensure the table exists is NOT done client-side (anon key can't run DDL).
   The user must run the setup SQL once in the Supabase SQL editor (see Settings panel / README).
   Table: pitch_data (id text primary key, data jsonb not null, updated_at timestamptz not null, updated_by text) */

async function pushToCloud(){
  if(!isSyncEnabled()) return;
  if(!sbClient) initSupabaseClient();
  if(!sbClient) return;
  if(_syncInFlight){ _syncQueued = true; return; }
  _syncInFlight = true;
  syncState.status = 'syncing'; renderSyncBadge();
  try{
    const cfg = getSyncConfig();
    ensureSyncMeta(DB);
    DB._sync.updatedAt = syncStamp();
    const payload = { id:SYNC_ROW_ID, data:DB, updated_at:DB._sync.updatedAt, updated_by:cfg.deviceId };
    const { error } = await sbClient.from('pitch_data').upsert(payload, { onConflict:'id' });
    if(error) throw error;
    syncState.status = 'synced'; syncState.lastSyncedAt = new Date().toISOString(); syncState.lastError = null;
  }catch(e){
    syncState.status = 'error'; syncState.lastError = e.message || String(e);
  }finally{
    _syncInFlight = false;
    renderSyncBadge();
    if(_syncQueued){ _syncQueued = false; pushToCloud(); }
  }
}
function queueCloudPush(){
  if(!isSyncEnabled()) return;
  clearTimeout(_syncDebounceTimer);
  _syncDebounceTimer = setTimeout(pushToCloud, 900); // debounce rapid successive saves
}
async function pullFromCloud(showToasts){
  if(!isSyncEnabled()) return false;
  if(!sbClient) initSupabaseClient();
  if(!sbClient) return false;
  syncState.status = 'syncing'; renderSyncBadge();
  try{
    const { data, error } = await sbClient.from('pitch_data').select('*').eq('id', SYNC_ROW_ID).maybeSingle();
    if(error) throw error;
    syncState.status = 'synced'; syncState.lastSyncedAt = new Date().toISOString(); syncState.lastError = null;
    if(data && data.data){
      const before = JSON.stringify(DB);
      const merged = mergeSyncedDB(DB, data.data);
      const changed = before !== JSON.stringify(merged);
      _applyingRemote = true;
      DB = merged;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
      _applyingRemote = false;
      if(showToasts) toast(changed ? 'Synced latest data from cloud' : 'Already up to date');
      if(typeof renderMain==='function' && document.getElementById('main')) renderMain();
      // If this device had data the cloud did not have, publish the merged result.
      // This is what makes additions/deletions converge across active devices.
      const localWasNewer = syncTime(DB._sync?.updatedAt) > syncTime(data.updated_at);
      if(changed && localWasNewer) await pushToCloud();
      return true;
    } else {
      // No cloud row yet — this device's local data becomes the initial cloud copy.
      if(showToasts) toast('No cloud data yet — uploading this device\'s data');
      await pushToCloud();
      return false;
    }
  }catch(e){
    _applyingRemote = false;
    syncState.status = 'error'; syncState.lastError = e.message || String(e);
    renderSyncBadge();
    return false;
  }
}
function subscribeRealtime(){
  if(!isSyncEnabled() || !sbClient) return;
  try{
    if(_realtimeChannel){ sbClient.removeChannel(_realtimeChannel); _realtimeChannel = null; }
    _realtimeChannel = sbClient.channel('pitch_data_changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'pitch_data', filter:`id=eq.${SYNC_ROW_ID}` }, (payload)=>{
        const cfg = getSyncConfig();
        const row = payload.new;
        if(!row) return;
        if(row.updated_by === cfg.deviceId) return; // ignore our own writes
        pullFromCloud(false);
      })
      .subscribe();
  }catch(e){ /* realtime is a nice-to-have; ignore failures */ }
}
function renderSyncBadge(){
  const el = document.getElementById('syncStatusBadge');
  if(!el) return;
  const map = {
    idle:['Local only','var(--ink-faint)'],
    syncing:['Syncing…','var(--yellow)'],
    synced:['Synced','var(--green)'],
    error:['Sync error','var(--red)'],
    offline:['Offline','var(--ink-faint)']
  };
  const [label,color] = map[syncState.status] || map.idle;
  el.textContent = label;
  el.style.color = color;
  el.title = syncState.lastError ? syncState.lastError : (syncState.lastSyncedAt ? 'Last synced '+new Date(syncState.lastSyncedAt).toLocaleTimeString() : '');
}

function migrate(parsed){
  if(!parsed.version) parsed.version = 1;
  if(!parsed.businesses) parsed.businesses = [];
  if(!parsed.settings) parsed.settings = {provider:'openai', apiKey:'', model:'gpt-4o-mini'};
  // ensure every business has all fields (safe forward-merge, never drop data)
  parsed.businesses = parsed.businesses.map(b => deepMerge(defaultBusiness(), b));
  parsed.version = DATA_VERSION;
  ensureSyncMeta(parsed);
  return parsed;
}
function deepMerge(base, override){
  const out = Array.isArray(base) ? base.slice() : Object.assign({}, base);
  for(const k in override){
    if(override[k] && typeof override[k]==='object' && !Array.isArray(override[k]) && base[k] && typeof base[k]==='object'){
      out[k] = deepMerge(base[k], override[k]);
    } else {
      out[k] = override[k];
    }
  }
  return out;
}

/* ---------------- Opportunity score calculation ---------------- */
function computeSuggestedScore(b){
  const d = b.digital;
  const vals = Object.values(d);
  const avgDigital = vals.reduce((a,c)=>a+c,0)/vals.length; // 0-10
  const weaknessPoints = (10-avgDigital)*4; // more weakness = more opportunity, up to 40
  let needPoints = 0;
  if(b.research.potentialNeeds && b.research.potentialNeeds.trim()) needPoints += 10;
  if(b.research.opportunities && b.research.opportunities.trim()) needPoints += 10;
  if(b.opp.services.length) needPoints += Math.min(b.opp.services.length*3, 15);
  let interestPoints = 0;
  const lastConv = b.conversations[b.conversations.length-1];
  if(lastConv){
    const m = {'Very Interested':15,'Interested':11,'Neutral':6,'Not Interested':0}[lastConv.interest]||5;
    interestPoints += m;
  }
  let dmPoints = 0;
  if(b.contacts.some(c=>c.decisionMaker==='Yes')) dmPoints = 10;
  let base = weaknessPoints + needPoints + interestPoints + dmPoints;
  return Math.max(0, Math.min(100, Math.round(base)));
}
function scoreFactors(b){
  const d = b.digital;
  const vals = Object.values(d);
  const avgDigital = vals.reduce((a,c)=>a+c,0)/vals.length;
  const factors = [];
  factors.push(`Digital presence averages ${avgDigital.toFixed(1)}/10 across audited channels — ${avgDigital<5?'significant gaps create opportunity':'reasonably strong, opportunity is more about strategy than fundamentals'}.`);
  factors.push(`${b.opp.services.length} Service${b.opp.services.length===1?'':'s'} identified as a fit.`);
  const lastConv = b.conversations[b.conversations.length-1];
  factors.push(lastConv ? `Last recorded interest level: ${lastConv.interest||'not set'}.` : 'No recorded conversations yet.');
  factors.push(b.contacts.some(c=>c.decisionMaker==='Yes') ? 'Decision-maker contact identified.' : 'Decision-maker not yet confirmed.');
  return factors;
}

let _historyReady = false;
function navigate(page, id=null, tab='summary', fromPopState=false){
  route = {page, id, tab};
  if(_historyReady && !fromPopState){
    const state = {page,id,tab};
    history.pushState(state, '', location.href.split('#')[0] + '#' + encodeURIComponent(page) + (id?'/' + encodeURIComponent(id):'') + (tab && tab!=='summary'?'/' + encodeURIComponent(tab):''));
  }
  window.scrollTo(0,0);
  renderShell();
  renderMain();
}
function initNavigationHistory(){
  if(!location.hash){ history.replaceState({page:'home',id:null,tab:'summary'}, '', location.href); }
  else {
    const parts=location.hash.slice(1).split('/').map(decodeURIComponent);
    route={page:parts[0]||'home',id:parts[1]||null,tab:parts[2]||'summary'};
  }
  window.addEventListener('popstate', e=>{
    const st=e.state;
    if(st && st.page){ route={page:st.page,id:st.id||null,tab:st.tab||'summary'}; window.scrollTo(0,0); renderShell(); renderMain(); }
  });
  _historyReady=true;
}
function renderMain(){
  const main = document.getElementById('main');
  if(route.page==='home') main.innerHTML = renderHome();
  else if(route.page==='businesses') main.innerHTML = renderBusinesses();
  else if(route.page==='profile') main.innerHTML = renderProfile(route.id);
  else if(route.page==='pipeline') main.innerHTML = renderPipeline();
  else if(route.page==='followups') main.innerHTML = renderFollowups();
  else if(route.page==='ai') main.innerHTML = renderAIPage();
  else if(route.page==='settings') main.innerHTML = renderSettings();
  else main.innerHTML = '<p>Not found.</p>';
  wireMain();
}

          <div class="attn-item" data-open="${b.id}">

function dayPart(){ const h=new Date().getHours(); return h<12?'morning':h<18?'afternoon':'evening'; }

function renderBusinesses(){
  let list = DB.businesses.slice();

  else if(f.sort==='oppHigh') list.sort((a,b)=>b.opportunityScore-a.opportunityScore);
  else if(f.sort==='oppLow') list.sort((a,b)=>a.opportunityScore-b.opportunityScore);
  else if(f.sort==='followup') list.sort((a,b)=>nextFollowupDate(a).localeCompare(nextFollowupDate(b)));

    };
    // fold into research notes non-destructively

    touch(b); saveDB(); closeModal();

function renderFollowups(){
  const all = [];
  DB.businesses.forEach(b=>b.followups.filter(f=>!f.completed).forEach(f=>all.push({b,f})));
  all.sort((a,c)=>a.f.date.localeCompare(c.f.date));
  const overdue = all.filter(x=>daysUntil(x.f.date)<0);
  const today = all.filter(x=>daysUntil(x.f.date)===0);
  const upcoming = all.filter(x=>daysUntil(x.f.date)>0);
  const group = (title,arr,cls)=>`<div class="fu-group" style="margin-bottom:22px;"><h3>${title} (${arr.length})</h3>${arr.length?arr.map(x=>`
    <div class="fu-item ${cls}">
      <div class="fu-left"><strong>${esc(x.b.name)}</strong> · ${esc(x.f.type)} — ${fmtDate(x.f.date)}<div>${esc(x.f.note)||''}</div></div>
      <div class="fu-actions">
        <button class="btn btn-sm" data-action="complete-followup" data-id="${x.b.id}" data-fid="${x.f.id}">Complete</button>
        <button class="btn btn-sm" data-open="${x.b.id}">Open</button>
      </div>
    </div>`).join(''):'<p style="color:var(--ink-soft); font-size:13.5px;">None.</p>'}</div>`;
  return `
  <div class="page-head"><div><h1>Follow-ups</h1><div class="sub">${all.length} open</div></div></div>
  ${group('Overdue', overdue, 'overdue')}
  ${group('Today', today, 'today')}
  ${group('Upcoming', upcoming, '')}
  `;
}

/* ================= EVENT WIRING ================= */
function wireMain(){
  document.querySelectorAll('[data-nav]').forEach(el=>{ if(!el.closest('.sidebar,.mobilenav')) el.onclick=()=>navigate(el.dataset.nav); });
  document.querySelectorAll('[data-open]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); navigate('profile', el.dataset.open); });
  document.querySelectorAll('[data-quick]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openQuickProfile(el.dataset.quick); });
  document.querySelectorAll('[data-action="add-business"]').forEach(el=>el.onclick=openAddBusinessModal);
  document.querySelectorAll('[data-action="delete-business"]').forEach(el=>el.onclick=async(e)=>{
    e.stopPropagation();
    const b = getBiz(el.dataset.id);
    if(!b) return;
    if(!await confirmDialog(`Delete "${b.name}"? This removes all its notes, contacts, follow-ups, and history. This cannot be undone.`, {confirmLabel:'Delete'})) return;
    markBusinessDeleted(el.dataset.id);
    DB.businesses = DB.businesses.filter(x=>x.id!==el.dataset.id);
    saveDB();
    if(route.page==='profile' && route.id===el.dataset.id) navigate('businesses');
    else renderMain();
    toast('Business deleted');
  });
  document.querySelectorAll('[data-ai-analyze]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    if(el.disabled || _aiRequestInFlight){ toast('An AI request is already running. Please wait.'); return; }
    const bizId = el.dataset.aiAnalyze;
    if(!DB.settings.apiKey){ toast('Add an AI API key in Settings first'); navigate('settings'); return; }
    if(route.page==='profile' && route.id===bizId && route.tab==='summary'){
      runAIAnalyze(bizId, 'inlineAiAnalyzeOut');
    } else {
      navigate('profile', bizId, 'summary');
      setTimeout(()=>runAIAnalyze(bizId, 'inlineAiAnalyzeOut'), 30);
    }
  });
  document.querySelectorAll('[data-ai-pitch]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    if(el.disabled || _aiRequestInFlight){ toast('An AI request is already running. Please wait.'); return; }
    const bizId = el.dataset.aiPitch;
    if(!DB.settings.apiKey){ toast('Add an AI API key in Settings first'); navigate('settings'); return; }
    if(route.page==='profile' && route.id===bizId && route.tab==='summary'){
      runAIPitch(bizId, 'inlineAiPitchOut');
    } else {
      navigate('profile', bizId, 'summary');
      setTimeout(()=>runAIPitch(bizId, 'inlineAiPitchOut'), 30);
    }
  });

}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function confirmDialog(message, opts={}){
  return new Promise(resolve=>{
    const danger = opts.danger!==false;
    openModal(`
      <div class="modal-head"><h2>${esc(opts.title||'Are you sure?')}</h2><button class="iconbtn" data-close>${xIcon()}</button></div>
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:20px; line-height:1.5;">${esc(message)}</p>
      <div class="qa-row"><button class="btn btn-ghost" id="cfNo">${esc(opts.cancelLabel||'Cancel')}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfYes">${esc(opts.confirmLabel||'Confirm')}</button></div>
    `);
    let settled=false;
    const finish=(val)=>{ if(settled) return; settled=true; closeModal(); resolve(val); };
    document.getElementById('cfYes').onclick=()=>finish(true);
    document.getElementById('cfNo').onclick=()=>finish(false);
    document.getElementById('ovl').addEventListener('click',(e)=>{ if(e.target.id==='ovl') finish(false); }, {once:true});
  });
}

let _aiRequestInFlight = false;
async function callAI(messages, maxTokens=900){
  if(_aiRequestInFlight) throw new Error('An AI request is already running. Please wait for it to finish.');
  _aiRequestInFlight = true;
  try{
    return await _callAIInner(messages, maxTokens);
  } finally {
    _aiRequestInFlight = false;
  }
}
async function _callAIInner(messages, maxTokens=900){
  const s = DB.settings;
  if(!s.apiKey) throw new Error('No API key configured. Add one in Settings.');
  if(s.provider==='anthropic'){
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':s.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:s.model||'claude-sonnet-4-6', max_tokens:maxTokens, messages:messages.filter(m=>m.role!=='system'), system:messages.find(m=>m.role==='system')?.content})
    });
    if(!res.ok){ const t=await res.text(); throw new Error(parseAIError(res.status,t)); }
    const data = await res.json();
    return (data.content||[]).map(c=>c.text||'').join('\n').trim();
  } else {
    const res = await fetch('https://api.openai.com/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body:JSON.stringify({model:s.model||'gpt-4o-mini', max_tokens:maxTokens, messages})
    });
    if(!res.ok){ const t=await res.text(); throw new Error(parseAIError(res.status,t)); }
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || '';
  }
}
function parseAIError(status,text){
  if(status===401) return 'Invalid API key. Check Settings.';
  if(status===429) return 'HTTP 429 — Rate limited by the AI provider. Please wait a bit before trying again.';
  if(status>=500) return 'AI provider is having issues. Try again shortly.';
  try{ const j=JSON.parse(text); return j.error?.message || `AI request failed (${status}).`; }catch(e){ return `AI request failed (${status}).`; }
}

function showAILoading(target){
  target.innerHTML = `<div class="ai-block"><div class="ai-loading"><div class="spinner"></div>Thinking through this business...</div></div>`;
}
function showAIError(target, msg){
  const friendly = /429|rate.?limit/i.test(msg) ? 'Rate limited by the AI provider (HTTP 429). Please wait a bit before trying again. The request was not retried automatically.' : msg;
  target.innerHTML = `<div class="ai-block" style="background:var(--red-soft); border-color:#ecc; "><h4 style="color:var(--red)">AI Error</h4><div class="body">${esc(friendly)}</div></div>`;
}

/* Disable/re-enable all AI action buttons for a given business (and generic AI-page buttons)
   while a request for that business/context is in flight, to prevent duplicate/concurrent clicks. */
function setAIButtonsBusy(bizId, busy){
  document.querySelectorAll(`[data-ai-analyze="${bizId}"],[data-ai-pitch="${bizId}"]`).forEach(el=>{
    el.disabled = busy;
    el.style.opacity = busy ? '.6' : '';
    el.style.cursor = busy ? 'not-allowed' : '';
  });
}
function setAIPageButtonsBusy(busy){
  ['aiPageAnalyze','aiPagePitch','aiPageDiscovery','aiPageFollowup','aiPageNotes'].forEach(id=>{
    const el = document.getElementById(id);
    if(el){ el.disabled = busy; el.style.opacity = busy ? '.6' : ''; el.style.cursor = busy ? 'not-allowed' : ''; }
  });
}

async function runAIAnalyze(bizId, outId){
  const b = getBiz(bizId); if(!b) return;
  const target = outId ? document.getElementById(outId) : ensureInlineTarget();
  if(_aiRequestInFlight){ toast('An AI request is already running. Please wait.'); return; }
  showAILoading(target);
  setAIButtonsBusy(bizId, true); setAIPageButtonsBusy(true);
  try{
    const sys = 'You are a sharp, pragmatic sales strategist helping a salesperson at a marketing/creative agency understand a prospect business before pitching. Be specific and reference the business data given. Avoid generic filler. No corporate buzzwords.';
    const prompt = `${buildBusinessContext(b)}\n\nProduce an analysis with these exact section headers:\nBUSINESS SNAPSHOT\nLIKELY PROBLEMS\nLIKELY NEEDS\nOPPORTUNITIES\nFIT SCORE (0-100 with one line reasoning)\nRECOMMENDED APPROACH\nWHAT NOT TO DO\n\nKeep each section to 2-4 concise sentences or bullet points.`;
    const result = await callAI([{role:'system',content:sys},{role:'user',content:prompt}], 900);
    b.ai.analyze = result; touch(b); saveDB();
    target.innerHTML = aiBlockHtml('Business Analysis', result);
    if(!outId) renderMain();
  }catch(e){ showAIError(target, e.message); }
  finally{ setAIButtonsBusy(bizId, false); setAIPageButtonsBusy(false); }
}

function ensureInlineTarget(){
  // used when triggered from list/profile buttons outside dedicated output area — fallback: toast + navigate
  const div = document.createElement('div');
  document.body.appendChild(div);
  div.style.display='none';
  return div;
}

/* ================= DATA MANAGEMENT ================= */
function exportJSON(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `pitch-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Exported');
}
function handleImport(e, isRestore){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.businesses)) throw new Error('Invalid file format');
      openImportChoiceModal(parsed, isRestore);
    }catch(err){ toast('Import failed: invalid JSON file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function openImportChoiceModal(parsed, isRestore){
  openModal(`
    <div class="modal-head"><h2>${isRestore?'Restore Backup':'Import Data'}</h2><button class="iconbtn" data-close>${xIcon()}</button></div>
    <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:16px;">This file contains ${parsed.businesses.length} businesses. How would you like to import it?</p>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-block" id="mergeBtn" style="justify-content:flex-start; padding:14px;">Merge — keep existing data and add new records</button>
      <button class="btn btn-danger btn-block" id="replaceBtn" style="justify-content:flex-start; padding:14px;">Replace — overwrite all existing data</button>
    </div>
  `);
  document.getElementById('mergeBtn').onclick = ()=>{
    const existingIds = new Set(DB.businesses.map(b=>b.id));
    let added=0;
    parsed.businesses.forEach(b=>{
      const merged = deepMerge(defaultBusiness(), b);
      if(existingIds.has(merged.id)) merged.id = uid('biz'); // avoid collision, never overwrite existing
      DB.businesses.push(merged); markBusinessPresent(merged.id); added++;
    });
    saveDB(); closeModal(); renderMain(); toast(`Merged ${added} businesses`);
  };
  document.getElementById('replaceBtn').onclick = ()=>{
    if(!confirm('This will permanently replace ALL current data with the imported file. Continue?')) return;
    if(!confirm('Are you absolutely sure? This cannot be undone.')) return;
    DB = migrate(parsed); saveDB(); closeModal(); renderMain(); toast('Data replaced');
  };
}
function deleteAllData(){
  if(!confirm('This will permanently delete ALL businesses and settings. Continue?')) return;
  if(!confirm('This action cannot be undone. Delete everything?')) return;
  const deletedAt = syncStamp();
  const tombstones = {};
  (DB.businesses || []).forEach(b=>{ tombstones[b.id] = deletedAt; });
  DB = { version:DATA_VERSION, businesses:[], settings:{provider:'openai', apiKey:'', model:'gpt-4o-mini'}, createdAt:nowISO(), _sync:{updatedAt:deletedAt, deletions:tombstones} };
  saveDB(); // saveDB() will also push the now-empty DB to the cloud if sync is enabled, keeping devices consistent
  navigate('home'); toast('All data deleted');
}

/* ================= THEME ================= */
function applyTheme(mode){
  const root = document.documentElement;
  root.classList.remove('theme-dark','theme-light');
  if(mode==='dark') root.classList.add('theme-dark');
  if(mode==='light') root.classList.add('theme-light');
  localStorage.setItem('pitch_theme', mode);
}
function initTheme(){
  const saved = localStorage.getItem('pitch_theme') || 'auto';
  applyTheme(saved);
}
function toggleTheme(){
  const root = document.documentElement;
  const isDark = root.classList.contains('theme-dark') ||
    (!root.classList.contains('theme-light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(isDark ? 'light' : 'dark');
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('#themeToggle') || e.target.closest('#themeToggleMobile')) toggleTheme();
});
